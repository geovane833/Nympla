<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Evento Especial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    .form-control {
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
    }
    .form-control:focus {
      background-color: #2c2c2c;
      border-color: #5c7cfa;
      box-shadow: 0 0 0 0.2rem rgba(92,124,250,0.25);
      color: #fff;
    }
    .btn-primary {
      background-color: #5c7cfa;
      border: none;
    }
    .btn-primary:hover {
      background-color: #4b6ed9;
    }
    .modal-content {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-radius: 1rem;
    }
    .modal-header, .modal-footer {
      border: none;
    }
  </style>
</head>
<body>

<div class="d-flex flex-column justify-content-center align-items-center vh-100">
  <img src="../imgs/logo.png" alt="Logo" class="mb-4" style="max-width: 200px;">

  <div class="card p-4" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4 text-white">Login</h2>

    <form>
      <div class="mb-3">
        <label for="inputEmail" class="form-label text-white">Email</label>
        <input type="email" class="form-control" id="inputEmail">
      </div>
      <div class="mb-3">
        <label for="inputPassword" class="form-label text-white">Senha</label>
        <input type="password" class="form-control" id="inputPassword">
      </div>
      <div class="d-grid gap-2">
        <button id="btnLogin" type="button" class="btn btn-primary">Entrar</button>
        <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#registerModal">
          Cadastrar Usuário
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Modal de Cadastro -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">Cadastrar Usuário</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password">
          </div>
          <div class="mb-3">
            <label for="birth" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="birth">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button id="btnSalvar" type="button" class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/login.js"></script>
<script src="../js/registrar.js"></script>
</body>
</html>
