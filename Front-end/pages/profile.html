<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonte semelhante ao Sympla -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Estilo customizado -->
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #F5F7F8; /* Fundo suave e neutro */
        padding-top: 10px;
      }

      h1 {
        font-weight: 600;
        margin-bottom: 10px;
      }

      /* Abas do menu */
      .nav-tabs .nav-link.active {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-bottom: none;
        font-weight: 600;
        color: #007bff;
      }

      .nav-tabs .nav-link {
        color: #6c757d;
      }

      /* Estilizando o card */
      .card {
        border: none;
        border-radius: 25px;
        background-color: rgba(255, 255, 255, 0.2); /* Fundo transparente com leve opacidade */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Sombra sutil */
        transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      }

      .card:hover {
        background-color: #ffffff; /* Fundo branco mais forte ao passar o mouse */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); /* Aumenta a sombra */
        transform: translateY(-5px); /* Levanta o card um pouco */
      }

      /* Imagem no card */
      .card-img-top {
        height: 200px;
        object-fit: cover;
        border-radius: 25px 25px 0 0; /* Arredondando o topo da imagem */
      }

      /* Corpo do card */
      .card-body {
        padding: 15px;
      }

      /* Botão de inscrição */
      .btn-primary {
        background-color: #10A37F; /* Cor suave de destaque */
        border: none;
        border-radius: 25px;
        font-weight: 600;
        padding: 12px 30px;
        transition: background-color 0.3s ease;
        text-transform: uppercase; /* Deixa o texto do botão em maiúsculas */
      }

      .btn-primary:hover {
        background-color: #19C463; /* Cor no hover */
      }

      /* Ajustes para lista de eventos */
      .list-group-item {
        border: none;
        border-radius: 10px;
        margin-bottom: 5px;
        padding: 0;
      }

      /* Estilo da descrição do evento */
      .event-description {
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
      }

      .event-date {
        font-size: 12px;
        color: #777;
      }

      /* Ajustes para dispositivos móveis */
      @media (max-width: 768px) {
        .card {
          margin-bottom: 15px; /* Menos espaçamento nos dispositivos móveis */
        }
      }
    </style>
  </head>  

  <body onload="onLoadPage()">
    <div class="container mt-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 id="welcomeMessage">Eventos Disponíveis</h1>
        <button id="logoutButton" class="btn btn-danger">Sair</button>
      </div>

      <!-- Abas -->
      <ul class="nav nav-tabs" id="eventTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="available-tab" data-bs-toggle="tab" data-bs-target="#available" type="button" role="tab" aria-controls="available" aria-selected="true">
            Eventos Disponíveis
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="registered-tab" data-bs-toggle="tab" data-bs-target="#registered" type="button" role="tab" aria-controls="registered" aria-selected="false">
            Eventos Inscritos
          </button>
        </li>
      </ul>

      <!-- Conteúdo das Abas -->
      <div class="tab-content mt-1" id="eventTabsContent">
        <div class="tab-pane fade show active" id="available" role="tabpanel" aria-labelledby="available-tab">
          <div id="availableEvents" class="row g-4"></div> <!-- Aqui os eventos são gerados -->
        </div>
        <div class="tab-pane fade" id="registered" role="tabpanel" aria-labelledby="registered-tab">
          <div id="registeredEvents" class="list-group mb-4"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  </body>
</html>
